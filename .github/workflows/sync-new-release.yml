name: Sync new release

on:
  schedule:
    - cron: "0 9 * * *" # 18:00 JST daily
  workflow_dispatch:
    inputs:
      series:
        description: "Series code to sync, for example OP17. Use latest to detect from official HTML."
        required: false
        default: "latest"
        type: string
      dry_run:
        description: "Check only; do not write files"
        required: false
        default: false
        type: boolean
      force:
        description: "Re-download images and overwrite card data even if they already exist"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-new-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pillow

      # 同期の前に、いま入っているデータと画面の前提が壊れていないかを確認する
      - name: Test data integrity
        run: node scripts/test-data-integrity.mjs

      # 入力値は env 経由で渡す。${{ }} を run の中へ直接展開すると、
      # 入力がそのままシェル片として実行される (script injection)
      - name: Sync official cards and images
        env:
          SERIES: ${{ inputs.series || 'latest' }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS=("--series=$SERIES")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=("--dry-run"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=("--force"); fi
          node scripts/sync-new-release.mjs "${ARGS[@]}" --python=python

      - name: Show changes
        run: git status --short

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        env:
          SERIES: ${{ inputs.series || 'latest' }}
        run: |
          if [ -z "$(git status --short)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add block-icon-overrides.json cards.json image-manifest.json card-features.json official-image-sources.json CardsWebP
          git commit -m "Sync $SERIES cards and images"
          git push
