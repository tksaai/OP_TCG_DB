name: Sync provisional cards

on:
  schedule:
    - cron: "20 9 * * *" # 18:20 JST daily
  workflow_dispatch:
    inputs:
      series:
        description: "Series code to sync from Akihabara, for example OP17. Use auto to detect missing official cards."
        required: false
        default: "auto"
        type: string
      dry_run:
        description: "Check only; do not write files"
        required: false
        default: false
        type: boolean
      include_promo:
        description: "Also sync promo card lists from Akihabara"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: sync-provisional-cards
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pillow

      # 入力値は env 経由で渡す (run の中へ直接展開しない)
      - name: Sync provisional cards
        env:
          SERIES: ${{ inputs.series || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run }}
          INCLUDE_PROMO: ${{ inputs.include_promo }}
        run: |
          EXTRA=()
          if [ "$DRY_RUN" = "true" ]; then EXTRA+=("--dry-run"); fi
          node scripts/sync-akihabara-cards.mjs "--series=$SERIES" "${EXTRA[@]}"
          if [ "$SERIES" != "PROMO" ] && [ "$INCLUDE_PROMO" != "false" ]; then
            node scripts/sync-akihabara-cards.mjs --series=PROMO "${EXTRA[@]}"
          fi

      - name: Sync provisional card images
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          IMAGE_ARGS=()
          if [ "$DRY_RUN" = "true" ]; then IMAGE_ARGS+=("--dry-run"); fi
          node scripts/sync-provisional-images.mjs "${IMAGE_ARGS[@]}"

      # 配信するのは WebP だけなので、ここで変換まで済ませる
      - name: Convert images to WebP
        if: ${{ inputs.dry_run != true }}
        run: python scripts/convert-images-to-webp.py

      - name: Point provisional cards at WebP images
        if: ${{ inputs.dry_run != true }}
        run: node scripts/update-provisional-image-paths.mjs

      - name: Rebuild image manifest
        if: ${{ inputs.dry_run != true }}
        run: node scripts/build-image-manifest.mjs

      - name: Rebuild image recognition features
        if: ${{ inputs.dry_run != true }}
        run: python scripts/build-card-features.py

      # 同期後の生成物を検査し、未配信の Cards/ パスや欠損画像をコミットしない
      - name: Test generated data integrity
        if: ${{ inputs.dry_run != true }}
        run: node scripts/test-data-integrity.mjs

      - name: Show changes
        run: git status --short

      - name: Commit and push
        if: ${{ inputs.dry_run != true }}
        run: |
          if [ -z "$(git status --short -- provisional-cards.json card-features.json image-manifest.json CardsWebP/Provisional)" ]; then
            echo "No provisional card or image changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add provisional-cards.json card-features.json image-manifest.json CardsWebP/Provisional
          git commit -m "Sync provisional cards"
          git push
